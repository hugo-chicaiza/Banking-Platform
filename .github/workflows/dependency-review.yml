# Revisión de dependencias en el PR — F-02 (#16)
#
# Qué hace que `pip-audit` y `npm audit` no hagan: mira el **diff** del PR y
# señala la dependencia que se está añadiendo o subiendo de versión, con su
# vulnerabilidad y su licencia, como comentario en el propio PR.
#
# El valor está en el momento: avisa *antes* de integrar, cuando quitar la
# dependencia cuesta un commit, y no después, cuando ya hay código que la usa.
# Es la categoría OWASP Top 10:2025 A03 — Software Supply Chain Failures.
#
# Gratuito en repositorios públicos.

name: Revisión de dependencias

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  revisar:
    name: Revisar dependencias nuevas
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: write   # para dejar el resumen como comentario

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@v5.0.0
        with:
          # Bloquea a partir de severidad alta. `moderate` generaría demasiado
          # ruido en las dependencias de desarrollo y el equipo acabaría
          # ignorando el control, que es peor que no tenerlo.
          fail-on-severity: high

          # Licencias que no se pueden usar en un producto cerrado: obligan a
          # publicar el código fuente del software que las enlaza. No es una
          # opinión sobre ellas, es una restricción del modelo de negocio.
          #
          # Dos cosas que la acción exige y que no son evidentes. Las dos
          # hacen que el job falle en segundos SIN revisar una sola
          # dependencia, que es el peor modo de fallo: parece un control
          # activo y no lo es.
          #
          # 1. FORMATO: una lista separada por COMAS, no un bloque YAML
          #    multilínea (`|`). Con `|` el valor llega como una sola cadena
          #    con saltos de línea y la acción la rechaza entera. Por eso se
          #    usa `>-`, que pliega los saltos en espacios y deja las comas.
          #
          # 2. IDENTIFICADORES: tienen que ser SPDX válidos y VIGENTES.
          #    `GPL-2.0`, `GPL-3.0` y `AGPL-3.0` a secas están obsoletos; hay
          #    que usar las variantes `-only` y `-or-later`.
          #
          # `SSPL-1.0` NO está en la lista de SPDX (no es una licencia
          # aprobada por la OSI), así que no se puede expresar aquí. Si alguna
          # vez entra una dependencia con SSPL, habrá que detectarla en la
          # revisión del PR.
          deny-licenses: >-
            GPL-2.0-only, GPL-2.0-or-later,
            GPL-3.0-only, GPL-3.0-or-later,
            AGPL-3.0-only, AGPL-3.0-or-later

          comment-summary-in-pr: on-failure
          warn-only: false
