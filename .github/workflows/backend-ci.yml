# Backend CI
#
# Cambio de F-02 (#16) sobre este archivo: SOLO el disparador y el filtro de
# ejecución. Los pasos se dejan tal cual, incluido el endurecimiento que
# introdujo el PR #227 (`--require-hashes --only-binary`, gitleaks fijado por
# SHA), que se conserva íntegro.
#
# --- Por qué se cambia el disparador ---
#
# Antes, el job se filtraba por el NOMBRE de la rama:
#
#     if: github.event_name != 'pull_request' ||
#         startsWith(github.head_ref, 'feat/backend-')
#
# Eso dejaba un agujero real: un PR desde `fix/`, `hotfix/`, `docs/`, `test/`
# o `chore/` —es decir, cinco de los siete carriles de la convención— no
# ejecutaba ningún control. Y como GitHub cuenta un job OMITIDO como
# SATISFECHO a efectos de una verificación obligatoria de rama, en cuanto se
# active la protección de `main` esos PR se integrarían con el CI «en verde»
# sin haber corrido ni un linter.
#
# Evidencia: Actions → Backend CI #15, rama `feature/docs-1-update`, `skipped`.
#
# El filtro se elimina y el job pasa a ejecutarse en todo PR a `main` y a
# `develop`. No hace falta un filtro por ruta: cada paso ya comprueba por su
# cuenta si hay algo que analizar y se salta solo cuando no lo hay, de modo
# que un PR que no toca el backend sigue siendo barato pero devuelve un
# resultado REAL en lugar de uno omitido.
#
# El criterio de aceptación de F-02 pide además que corra en cada PR a `main`.

name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Al subir un commit nuevo, el resultado del anterior ya no interesa.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  quality-security:
    name: Backend Quality and Security
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install tools and backend dependencies
        # Lock con hashes + solo binarios: versiones verificadas y sin ejecutar setup.py (Sonar S8544/S8541)
        run: |
          pip install --require-hashes --only-binary :all: -r Backend/requirements-dev.txt

      - name: Check formatting
        run: |
          if find Backend -type f -name '*.py' -print -quit 2>/dev/null | grep -q .; then
            ruff format --check Backend
          else
            echo "SKIPPED: No Python files found."
          fi

      - name: Lint Python code
        run: |
          if find Backend -type f -name '*.py' -print -quit 2>/dev/null | grep -q .; then
            ruff check Backend
          else
            echo "SKIPPED: No Python files found."
          fi

      - name: Check Python syntax
        run: |
          if find Backend -type f -name '*.py' -print -quit 2>/dev/null | grep -q .; then
            python -m compileall -q Backend
          else
            echo "SKIPPED: No Python files found."
          fi

      - name: Check types
        run: |
          if find Backend -type f -name '*.py' -print -quit 2>/dev/null | grep -q .; then
            pyright Backend
          else
            echo "SKIPPED: No Python files found."
          fi

      - name: Run tests
        run: |
          if find Backend/tests -type f -name 'test_*.py' -print -quit 2>/dev/null | grep -q .; then
            pytest Backend/tests
          else
            echo "SKIPPED: No tests found."
          fi

      - name: Scan Python security issues
        run: |
          if find Backend -type f -name '*.py' -print -quit 2>/dev/null | grep -q .; then
            bandit -r Backend -x Backend/tests
          else
            echo "SKIPPED: No Python files found."
          fi

      - name: Audit dependencies
        run: |
          if [ -f Backend/requirements.txt ]; then
            pip-audit -r Backend/requirements.txt
          else
            echo "SKIPPED: requirements.txt not found."
          fi

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}