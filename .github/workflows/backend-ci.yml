name: Backend CI

# E0-11: corre en TODO pull request hacia develop (antes solo en ramas feat/backend-*, así
# un PR desde fix/ se integraba sin CI) y en push a ramas feat/ y fix/ del backend.
on:
  push:
    branches:
      - 'feat/backend-*'
      - 'fix/backend-*'
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  quality-security:
    name: Backend Quality and Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install tools and backend dependencies
        # Lock con hashes + solo binarios: versiones verificadas y sin ejecutar setup.py (Sonar S8544/S8541)
        run: |
          pip install --require-hashes --only-binary :all: -r Backend/requirements-dev.txt

      - name: Check formatting
        run: |
          if find Backend -type f -name '*.py' -print -quit 2>/dev/null | grep -q .; then
            ruff format --check Backend
          else
            echo "SKIPPED: No Python files found."
          fi

      - name: Lint Python code
        run: |
          if find Backend -type f -name '*.py' -print -quit 2>/dev/null | grep -q .; then
            ruff check Backend
          else
            echo "SKIPPED: No Python files found."
          fi

      - name: Check Python syntax
        run: |
          if find Backend -type f -name '*.py' -print -quit 2>/dev/null | grep -q .; then
            python -m compileall -q Backend
          else
            echo "SKIPPED: No Python files found."
          fi

      - name: Check types
        run: |
          if find Backend -type f -name '*.py' -print -quit 2>/dev/null | grep -q .; then
            pyright Backend
          else
            echo "SKIPPED: No Python files found."
          fi

      - name: Run tests (cobertura con piso)
        # E0-11: falla si la cobertura de Backend/app baja del piso de Backend/.cobertura-piso
        run: |
          pytest Backend/tests --cov=Backend/app --cov-report=term --cov-report=xml:cobertura.xml             --cov-fail-under="$(cat Backend/.cobertura-piso)"

      - name: El piso de cobertura solo sube
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          ANTES=$(git show "origin/${{ github.base_ref }}:Backend/.cobertura-piso" 2>/dev/null || echo 0)
          AHORA=$(cat Backend/.cobertura-piso)
          echo "piso: ${ANTES} -> ${AHORA}"
          if [ "$AHORA" -lt "$ANTES" ]; then echo "El piso de cobertura no puede bajar (${ANTES} -> ${AHORA})"; exit 1; fi

      - name: Scan Python security issues
        run: |
          if find Backend -type f -name '*.py' -print -quit 2>/dev/null | grep -q .; then
            bandit -r Backend -x Backend/tests
          else
            echo "SKIPPED: No Python files found."
          fi

      - name: Audit dependencies
        run: |
          pip-audit -r Backend/requirements.txt

      - name: Lista de componentes (SBOM CycloneDX)
        # E0-11: en cada construcción; ASVS 15.1.2 · PCI E-003 a E-009
        run: |
          pip-audit -r Backend/requirements.txt -f cyclonedx-json -o sbom-backend.cdx.json || test -s sbom-backend.cdx.json

      - name: Publicar SBOM y cobertura
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-sbom-y-cobertura
          path: |
            sbom-backend.cdx.json
            cobertura.xml
          if-no-files-found: warn
          retention-days: 90

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}