####################################################################
# SonarQube — F-02 (#16)
#
# Qué aporta sobre ruff, mypy, bandit y eslint: esas herramientas dan el
# estado de HOY. Sonar mide la TENDENCIA y, sobre todo, aplica la regla del
# «código nuevo»: no exige arreglar la deuda que ya existe, exige que lo que
# se añade cumpla el estándar. Es lo que hace sostenible la calidad en un
# proyecto de varios meses sin parar el avance.
#
# Antes de usarlo hay que crear el proyecto en SonarQube Cloud (gratis para
# repositorios públicos) y guardar SONAR_TOKEN como secreto del repositorio.
# Instrucciones paso a paso: docs/08-Quality/Quality-Gates.md
#
# Mientras SONAR_TOKEN no exista, el job del CI se omite con un aviso en lugar
# de fallar, así que este archivo puede integrarse desde ya.
#
# Referencia de propiedades: https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/analysis-parameters/
####################################################################

# --- Identificación del proyecto ------------------------------------
# AJUSTAR: estos dos valores los asigna SonarQube Cloud al crear el proyecto.
# El `organization` es el de la cuenta de GitHub vinculada.
sonar.projectKey=hugo-chicaiza_Banking-Platform
sonar.organization=hugo-chicaiza

sonar.projectName=Banking Platform
sonar.projectVersion=0.1.0
sonar.links.homepage=https://github.com/hugo-chicaiza/Banking-Platform
sonar.links.issue=https://github.com/hugo-chicaiza/Banking-Platform/issues

# --- Qué se analiza -------------------------------------------------
sonar.sources=Backend/app,Frontend/src
sonar.tests=Backend/tests,Frontend/src

# Las pruebas se analizan con reglas propias: en una prueba, una línea
# duplicada o un número literal no son defectos, y medir su complejidad no
# aporta nada. Lo que sí importa es que no haya pruebas vacías ni aserciones
# que no comprueban nada.
sonar.test.inclusions=Backend/tests/**/*.py,Frontend/src/**/*.spec.ts

sonar.sourceEncoding=UTF-8

# --- Qué se excluye y por qué ---------------------------------------
sonar.exclusions=\
  **/node_modules/**,\
  **/.venv/**,\
  **/venv/**,\
  **/antenv/**,\
  **/__pycache__/**,\
  **/dist/**,\
  **/coverage/**,\
  **/reports/**,\
  **/.angular/**,\
  GitHubProject_Files/**,\
  docs/**,\
  **/*.min.js,\
  **/*.min.css

# Archivos excluidos de la medición de COBERTURA (se siguen analizando con las
# reglas de calidad; solo no cuentan para el porcentaje):
#  - Los archivos de entorno son constantes: cubrirlos no demuestra nada.
#  - `main.py`/`main.ts` son el arranque; se prueban arrancando la aplicación,
#    no con una prueba unitaria.
#  - Los `repository.py` son SQL puro: se cubren con pruebas de integración
#    contra una base real, que es alcance de F-06.
sonar.coverage.exclusions=\
  Frontend/src/environments/**,\
  Frontend/src/main.ts,\
  Backend/app/main.py,\
  Backend/app/modules/*/repository.py,\
  **/__init__.py,\
  **/*.spec.ts

# La duplicación en los archivos de entorno es intencional: los tres entornos
# tienen la misma forma a propósito, y eso es una ventaja, no deuda.
sonar.cpd.exclusions=\
  Frontend/src/environments/**,\
  Backend/tests/**

# --- Informes que produce el CI -------------------------------------
# Sonar no ejecuta las pruebas: lee los informes que generan los jobs de CI.
# Si una ruta no existe, Sonar avisa pero no falla, lo que permite analizar
# solo una de las dos partes cuando el PR solo toca una.
sonar.python.version=3.14
sonar.python.coverage.reportPaths=Backend/reports/coverage.xml
sonar.python.xunit.reportPath=Backend/reports/junit.xml

sonar.javascript.lcov.reportPaths=Frontend/coverage/lcov.info
sonar.typescript.tsconfigPaths=Frontend/tsconfig.json

# --- Definición de «código nuevo» -----------------------------------
# La puerta de calidad se aplica a lo que cambia respecto a la rama de
# referencia, no a todo el proyecto. Así el equipo no arrastra la deuda
# histórica en cada PR, pero tampoco añade deuda nueva.
sonar.newCode.referenceBranch=develop

# --- Integración con el PR ------------------------------------------
# Sonar deja los hallazgos del código nuevo como comentarios en la línea
# correspondiente del PR.
sonar.scm.provider=git

# --- Notas sobre la puerta de calidad -------------------------------
# Los umbrales NO se configuran aquí: viven en la interfaz de SonarQube, en la
# puerta de calidad asociada al proyecto. Los acordados para la Épica 0 están
# documentados en docs/08-Quality/Quality-Gates.md, con el motivo de cada uno.
# Un umbral que solo existe en la interfaz y no está escrito en el repositorio
# se cambia sin que nadie lo revise; de ahí el documento.
